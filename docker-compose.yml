# 전체 실행(채점용): docker compose up --build   → PC: http://localhost:${APP_PORT:-3000}
#                                                 휴대폰 등 다른 기기: https://${PUBLIC_HOST}:${HTTPS_PORT:-8443}
# 개발 실행:          docker compose up -d db mediamtx → 서비스 이름을 지정하면 그 서비스(와 의존 서비스)만 뜬다
#                     호스트에서 bootRun하는 백엔드를 MediaMTX가 부르도록 MEDIAMTX_BACKEND_URL을 지정한다
#                     (예: MEDIAMTX_BACKEND_URL=http://host.docker.internal:8080)
# 값은 루트 .env에서 바꿀 수 있고(.env.example 참고), .env가 없으면 아래 기본값을 쓴다.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chzzz}
      POSTGRES_USER: ${DB_USERNAME:-chzzz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chzzz}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 라이브 방송 미디어 서버 (WebRTC WHIP/WHEP, ADR-0003)
  mediamtx:
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # 인증·훅으로 부를 백엔드. 전체 실행은 compose 내부 backend, 개발 실행은 호스트의 bootRun
      MEDIAMTX_BACKEND_URL: ${MEDIAMTX_BACKEND_URL:-http://backend:8080}
      MTX_AUTHHTTPADDRESS: ${MEDIAMTX_BACKEND_URL:-http://backend:8080}/internal/mediamtx/auth
      # 브라우저·휴대폰에 ICE 후보로 알릴 주소와 미디어 포트 (호스트와 컨테이너 포트를 같게 둔다)
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:-localhost}
      MTX_WEBRTCLOCALUDPADDRESS: :${WEBRTC_PORT:-8189}
      MTX_WEBRTCLOCALTCPADDRESS: :${WEBRTC_PORT:-8189}
    ports:
      - "${WEBRTC_PORT:-8189}:${WEBRTC_PORT:-8189}/udp"
      - "${WEBRTC_PORT:-8189}:${WEBRTC_PORT:-8189}/tcp"
      # WHIP/WHEP HTTP. 개발 실행의 Vite가 localhost로 부른다. 밖에서는 프록시(/media)를 거친다
      - "127.0.0.1:8889:8889"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 개발 실행에서 단독으로 뜨도록 backend에 의존하지 않는다. WebRTC HTTP 포트가 열리면 healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8889"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # 컨테이너 안에서는 DB를 서비스 이름(db)으로 찾는다
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-chzzz}
      DB_USERNAME: ${DB_USERNAME:-chzzz}
      DB_PASSWORD: ${DB_PASSWORD:-chzzz}
      SERVER_PORT: "8080"
      # 업로드 폴더는 아래 uploads 볼륨이 마운트된 컨테이너 안 경로로 고정한다
      RECORDING_STORAGE_DIR: /app/data/uploads
      RECORDING_MAX_UPLOAD_SIZE: ${RECORDING_MAX_UPLOAD_SIZE:-500MB}
      # 대기 상태의 라이브 방송이 송출 없이 이 시간을 넘기면 종료로 정리한다
      LIVE_PENDING_TIMEOUT: ${LIVE_PENDING_TIMEOUT:-60s}
      # 후원 결제(토스페이먼츠 결제위젯 테스트 모드). 기본값은 토스 문서에 공개된 결제위젯용 문서 키다.
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
      TOSS_API_BASE_URL: ${TOSS_API_BASE_URL:-https://api.tosspayments.com}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      # /media/ 요청(WHIP/WHEP)을 넘길 MediaMTX WebRTC HTTP 주소
      MEDIAMTX_URL: http://mediamtx:8889
      # nginx 요청 본문 한도를 백엔드 업로드 한도와 같은 값으로 맞춘다
      RECORDING_MAX_UPLOAD_SIZE: ${RECORDING_MAX_UPLOAD_SIZE:-500MB}
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      # nginx는 시작할 때 프록시 대상 이름을 찾으므로 mediamtx가 먼저 떠 있어야 한다
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 휴대폰 접속용 HTTPS 입구 (ADR-0004). 로컬 CA로 서명한 인증서로 https://PUBLIC_HOST:HTTPS_PORT를 연다.
  # /media/*는 MediaMTX로, 나머지는 frontend(nginx)로 보낸다. 설정은 caddy/Caddyfile
  caddy:
    image: caddy:2.11.7-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 로컬 CA와 인증서를 보관해 재시작해도 같은 인증서를 쓴다(휴대폰에서 경고를 다시 넘기지 않아도 된다)
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      # 인증서의 주소와 포트가 브라우저 주소창과 같아야 하므로 호스트와 컨테이너 포트를 같게 둔다
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    depends_on:
      frontend:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      # Caddy 관리 API(컨테이너 안 localhost:2019)가 응답하면 설정을 읽고 떠 있는 것이다
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
