# nginx 프론트 2대(고정). 정적 파일을 주고 /api는 backend Service로, /media는 mediamtx Service로 넘긴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # 로컬에서 `docker build -t chzzz-frontend:k8s frontend`로 빌드한 이미지 (backend.yaml의 설명 참고)
          image: chzzz-frontend:k8s
          imagePullPolicy: Always
          env:
            - name: BACKEND_URL
              value: http://backend:8080
            - name: MEDIAMTX_URL
              value: http://mediamtx:8889
            # nginx 요청 본문 한도를 백엔드 업로드 한도와 같은 값으로 맞춘다
            - name: RECORDING_MAX_UPLOAD_SIZE
              valueFrom: {configMapKeyRef: {name: app-config, key: RECORDING_MAX_UPLOAD_SIZE}}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          lifecycle:
            # 엔드포인트에서 빠지는 것이 반영될 때까지 기다린 뒤 nginx가 종료 신호(SIGQUIT, 처리 중 요청을 끝내고 종료)를 받는다.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# 진입점: http://localhost:8000 (compose의 3000, 이 PC의 다른 프로세스가 쓰는 8080을 피한다)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 8000
      targetPort: http
