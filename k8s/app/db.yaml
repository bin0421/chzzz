# PostgreSQL 1대 (compose의 db). 데이터는 ../storage의 db-data PVC에 둔다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  # 같은 데이터 폴더를 두 PostgreSQL이 동시에 열지 않도록, 새 파드는 옛 파드가 내려간 뒤 뜬다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: app-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: app-config, key: DB_USERNAME}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
            # 볼륨 최상위가 아닌 하위 폴더를 데이터 폴더로 쓴다(볼륨에 다른 파일이 있어도 initdb가 실패하지 않게).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
# 클러스터 안에서만 쓰는 주소(db:5432). 호스트로는 열지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
