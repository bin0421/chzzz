spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chzzz}
spring.datasource.username=${DB_USERNAME:chzzz}
spring.datasource.password=${DB_PASSWORD:chzzz}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# 5단계: 로그인 세션을 PostgreSQL에 두어 인스턴스끼리 공유한다(ADR-0009). 테이블은 Flyway V5가 만든다.
spring.session.jdbc.initialize-schema=never
# 세션 쿠키 이름은 3단계(ADR-0005)와 같게 둔다. Spring Session 기본값은 SESSION이다.
server.servlet.session.cookie.name=JSESSIONID
# 응답 헤더 X-Backend-Instance에 실을 인스턴스 이름. 비우면 호스트 이름(컨테이너 ID·파드 이름)이다.
instance.name=${INSTANCE_NAME:}

recording.storage-dir=${RECORDING_STORAGE_DIR:./data/uploads}
recording.max-upload-size=${RECORDING_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-file-size=${recording.max-upload-size}
spring.servlet.multipart.max-request-size=${recording.max-upload-size}

live.pending-timeout=${LIVE_PENDING_TIMEOUT:60s}
live.pending-sweep-interval=10s

# 4단계 후원 결제(토스페이먼츠 테스트 모드). 기본값은 토스 문서·공식 샘플에 공개된 결제위젯용 문서 키(test_gck_docs_·test_gsk_docs_)다.
payment.toss.client-key=${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
payment.toss.secret-key=${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
payment.toss.api-base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}
