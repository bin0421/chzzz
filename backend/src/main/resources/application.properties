spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chzzz}
spring.datasource.username=${DB_USERNAME:chzzz}
spring.datasource.password=${DB_PASSWORD:chzzz}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

recording.storage-dir=${RECORDING_STORAGE_DIR:./data/uploads}
recording.max-upload-size=${RECORDING_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-file-size=${recording.max-upload-size}
spring.servlet.multipart.max-request-size=${recording.max-upload-size}

live.pending-timeout=${LIVE_PENDING_TIMEOUT:60s}
live.pending-sweep-interval=10s

